<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing Labor KPI Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 1.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // API Configuration
        // Detects if running locally (port 8000) vs hosted on Vercel
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
        
        // When hosted on Vercel, the API and Frontend share the same domain!
        const API_BASE = isLocal ? 'http://localhost:8000/api' : '/api';

        function App() {
            const [activeTab, setActiveTab] = useState('portfolio');
            const [filters, setFilters] = useState({ acq: 'All', region: 'All', facility: 'All' });
            const [execData, setExecData] = useState([]);

            useEffect(() => {
                // Fetch initial data from FastAPI/Supabase backend
                fetch(`${API_BASE}/dashboard/executive`)
                    .then(res => res.json())
                    .then(data => setExecData(data.data || []))
                    .catch(err => console.error("API Error (Make sure backend is running):", err));
            }, []);

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md z-20">
                        <h1 className="text-xl font-bold tracking-tight">Avir Labor KPI Analytics</h1>
                        <div className="flex gap-4">
                            <button className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm font-bold shadow transition-colors">
                                Upload Payroll File
                            </button>
                            <button className="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded text-sm font-bold shadow transition-colors">
                                Export Analytics Workbook
                            </button>
                        </div>
                    </header>

                    {/* Slicer Bar */}
                    <div className="bg-white border-b px-4 py-2 flex items-center shadow-sm z-10 gap-2">
                        <span className="text-xs font-bold text-gray-500 uppercase">Global Slicers:</span>
                        <select className="text-xs border rounded p-1" value={filters.acq} onChange={e => setFilters({...filters, acq: e.target.value})}>
                            <option value="All">All Organizations</option>
                        </select>
                        <select className="text-xs border rounded p-1" value={filters.region} onChange={e => setFilters({...filters, region: e.target.value})}>
                            <option value="All">All Regions</option>
                        </select>
                        <select className="text-xs border rounded p-1" value={filters.facility} onChange={e => setFilters({...filters, facility: e.target.value})}>
                            <option value="All">All Facilities</option>
                        </select>
                    </div>

                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar Navigation */}
                        <aside className="w-64 bg-slate-800 text-slate-300 flex flex-col overflow-y-auto">
                            <nav className="flex-1 py-4">
                                {['Executive Portfolio', 'Portfolio Facility Trends', 'Facility Drilldown', 'OT Analysis', 'Bonus Analysis', 'Labor Pressure Ranking', 'Employee Review'].map(tab => (
                                    <div 
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`px-6 py-2 cursor-pointer transition-colors ${activeTab === tab ? 'bg-blue-600 text-white border-l-4 border-blue-400 font-bold' : 'hover:bg-slate-700 border-l-4 border-transparent'}`}
                                    >
                                        {tab}
                                    </div>
                                ))}
                            </nav>
                        </aside>

                        {/* Main Content Area */}
                        <main className="flex-1 p-6 overflow-auto bg-slate-50">
                            {activeTab === 'Executive Portfolio' && (
                                <div className="space-y-6">
                                    <h2 className="text-3xl font-bold text-slate-800">Executive Portfolio Dashboard</h2>
                                    <div className="grid grid-cols-4 gap-4">
                                        <div className="glass-card"><h3 className="text-xs text-gray-500 uppercase">Total OT $</h3><div className="text-2xl font-bold mt-2">$0</div></div>
                                        <div className="glass-card"><h3 className="text-xs text-gray-500 uppercase">Total Bonus $</h3><div className="text-2xl font-bold mt-2">$0</div></div>
                                        <div className="glass-card"><h3 className="text-xs text-gray-500 uppercase">Avg HPPD</h3><div className="text-2xl font-bold mt-2 text-indigo-600">0.0</div></div>
                                        <div className="glass-card border-l-4 border-red-500"><h3 className="text-xs text-red-500 uppercase">Critical Facilities</h3><div className="text-2xl font-bold mt-2 text-red-600">0</div></div>
                                    </div>
                                    
                                    {/* Charts Example */}
                                    <div className="glass-card h-80">
                                        <h3 className="text-sm font-bold text-gray-700 uppercase mb-4">Portfolio Trend</h3>
                                        {execData.length > 0 ? (
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={execData}>
                                                    <CartesianGrid strokeDasharray="3 3" />
                                                    <XAxis dataKey="pay_period_id" />
                                                    <YAxis />
                                                    <Tooltip />
                                                    <Legend />
                                                    <Line type="monotone" dataKey="ot_dollars" stroke="#ef4444" name="OT Dollars" />
                                                    <Line type="monotone" dataKey="bonus_dollars" stroke="#eab308" name="Bonus Dollars" />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        ) : (
                                            <div className="flex items-center justify-center h-full text-gray-400">No data connected yet. Run backend/main.py and upload a file.</div>
                                        )}
                                    </div>
                                </div>
                            )}
                            
                            {activeTab !== 'Executive Portfolio' && (
                                <div className="glass-card">
                                    <h2 className="text-2xl font-bold mb-4">{activeTab}</h2>
                                    <p className="text-gray-500">Connect this view to the Supabase API endpoints established in backend/main.py.</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
